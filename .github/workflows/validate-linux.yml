name: Linux validation

on:
    push:
        branches:
            - main
        paths:
            - '.github/workflows/validate-linux.yml'
            - 'agent/**'
            - 'core/**'
            - 'frontend/**'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    agent:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: agent/go.mod
                  cache-dependency-path: agent/go.sum
            - name: Prepare embedded VM helpers
              run: ./utils/vm/helper/prepare.sh
              working-directory: agent
            - name: Test agent services, API, and migrations
              run: go test ./app/service/... ./app/api/v2 ./init/migration/...
              working-directory: agent

    core:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version-file: core/go.mod
                  cache-dependency-path: core/go.sum
            - name: Test core docs, migrations, i18n, and constants
              run: go test ./cmd/server/docs ./init/migration/migrations ./i18n ./constant
              working-directory: core

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - name: Install frontend dependencies
              run: npm ci
              working-directory: frontend
            - name: Build frontend and generate type declarations
              run: npm run build:pro
              working-directory: frontend
            - name: Type-check frontend
              run: npm run type-check
              working-directory: frontend
